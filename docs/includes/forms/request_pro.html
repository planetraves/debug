<div id="request-container" class="page-container" hidden>
    <section id="notice-tile" class="notice-tile">
        <div class="notice-section-title">
            <span class="material-symbols-outlined" aria-hidden="true">electric_bolt</span>
            <span id="title">Demander un compte pro</span>
        </div>
        <div class="notice-text about" data-string="account.md#pro-request"></div>
    </section>

    <article class="submit-tile" data-allow-action>
        <form id="request-form">
            <label class="pico">
                Description de votre demande
                <div class="textarea-wrapper">
                    <textarea
                        class="details-textarea"
                        id="details-input"
                        placeholder="minimum 100 charactères"
                        minlength="100"
                        rows="8"
                        data-input-type="request-details"
                    ></textarea>
                    <div class="char-counter">
                        <span id="request-char-count">0</span>/100
                    </div>
                </div>
            </label>

            <label class="pico">
                <button type="submit" id="button" data-action="send-request">Envoyer</button>
            </label>
        </form>

    </article>
</div>
