<div id="rstpwd-container" class="page-container" hidden>
    <section class="notice-tile">
        <div class="notice-section-title">
            <span class="material-symbols-outlined" aria-hidden="true">lock_reset</span>
            <span id="title">Réinitialiser le mot de passe</span>
        </div>
        <p id="text" class="notice-text">
            <strong>Demandez</strong> la réinitialisation de votre mot de passe et vous recevrez un email.
        </p>
    </section>
    <article class="formtile-tile pico">
        <form id="rstpwd-form">
            <label>
                Email
                <input
                    type="email"
                    id="email"
                    placeholder="email@exemple.fr"
                    required
                >
            </label>

            <div>
                <button type="submit" id="button" data-action="send-reset-password-request">Envoyer</button>
            </div>
        </form>

        <p>
            La mémoire vous est revenue ?
            <a href="#" id="show-signin-from-rst" data-action="show-signin">Se connecter</a>
        </p>
    </article>
</div>
