<!-- RESET PASSWORD -->
<div id="reset-pwd-container">
    <section class="notice-tile">
        <div class="notice-section-title">
            <span class="material-symbols-outlined" aria-hidden="true">lock_reset</span>
            <span id="title">Réinitialiser le mot de passe</span>
        </div>
        <p id="text" class="notice-text">
            <strong>Vous avez demandé</strong> la réinitialisation de votre mot de passe.
        </p>
    </section>
    <article class="formtile-tile pico">
        <form id="reset-pwd-form">
            <label>
                Nouveau mot de passe
                <input
                    type="password"
                    id="password"
                    placeholder="Minimum 8 caractères"
                    minlength="8"
                    required
                >
                <input
                    type="password"
                    id="passwordConfirm"
                    placeholder="Confirmez votre mot de passe"
                    minlength="8"
                    required
                >
            </label>

            <div>
                <button type="submit" id="button" data-action="reset-password">Réinitialiser</button>
            </div>
        </form>
    </article>
</div>
