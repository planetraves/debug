<div id="signin-container" class="page-container" hidden>
    <section class="notice-tile">
        <div class="notice-section-title">
            <span class="material-symbols-outlined" aria-hidden="true">login</span>
            <span id="title">Se connecter</span>
        </div>
        <p id="text" class="notice-text">
            <strong>Connectez vous</strong> pour publier vos évènements et contribuer à l'agenda culturel.
        </p>
    </section>
    <article class="formtile-tile pico">
        <form id="signin-form">
            <label>
                Email
                <input
                    type="email"
                    id="email"
                    placeholder="email@exemple.fr"
                    required
                >
            </label>

            <label>
                Mot de passe
                <input
                    type="password"
                    id="password"
                    placeholder=""
                    required
                >
            </label>

            <div>
                <button type="submit" id="button" data-action="login">Se connecter</button>
            </div>
        </form>

        <p>
            Pas de compte ?
            <a href="#" id="show-signup" data-action="show-signup">Créer un compte</a>
        </p>
        <p>
            Mot de passe oublié ?
            <a href="#" id="reset-password" data-action="show-reset-password">Réinitialiser</a>
        </p>
    </article>
</div>
