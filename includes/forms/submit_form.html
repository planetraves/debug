<div id="submit-container" class="page-container" hidden>
    <section id="notice-tile" class="notice-tile">
        <div class="notice-section-title">
            <span class="material-symbols-outlined" aria-hidden="true">info</span>
            <span id="title">Publier un évènement</span>
        </div>
        <p id="text" class="notice-text">
            <strong>Remplissez le formulaire</strong> pour publier un nouvel évènement.<br><br>Selon le type de contributeur·rice que vous êtes, vous pouvez publier un nouvel évènement instantanément ou avec un délai de trois jours.
        </p>
    </section>
    <div id="account-detail" class="account-tile detail-section" hidden>
        <div class="detail-row">
            <span class="label">Contributeur·rice</span>
            <span id="account-role" class="value detail-user"></span>
        </div>

        <div id="detail-permission"></div>
        
        <p>
            Plus d'infos sur
            <a href="../account/" >Mon compte</a>
        </p>
    </div>

    <article class="submit-tile" data-allow-action>
        <form id="event-form">
            <label class="pico">
                Titre de l'évènement *
                <input type="text" id="title" placeholder="60 charactères maximum" maxlength="60" required>
            </label>

            <label class="pico">
                <span class="label-help">
                    Catégories *
                    <button type="button" class="help-btn" data-action="open-category-help" aria-label="Aide : catégories">
                        <span class="material-symbols-outlined">help</span>
                    </button>
                </span>
                <div id="category-choices" class="category-choices"></div>
            </label>

            <label for="tag-input" class="pico">
                <span class="label-help">
                    Tags *
                    <button type="button" class="help-btn" data-action="open-tag-help" aria-label="Aide : tags">
                        <span class="material-symbols-outlined">help</span>
                    </button>
                </span>
            </label>
            <div class="tag-input-container" id="tag-container">
                <input type="text" id="tag-input" data-action="tag-input" placeholder="Suggestions: jazz, poesie, cirque..." autocomplete="off">
            </div>

            <label class="pico">
                Nom du lieu *
                <input type="text" id="location_name" placeholder="" required>
            </label class="pico">

            <label class="pico">
                Adresse du lieu *
                <div id="address-autocomplete" class="address-autocomplete">
                    <input type="text" id="location_address" class="search-address" placeholder="Numéro et rue *" autocomplete="off" data-input-type="address-search" required>
                    <div class="address-suggestions hidden"></div>
                </div>
                <input type="text" id="location_address_2" placeholder="Complément d'adresse">
                <input type="number" id="location_address_code" inputmode="numeric" placeholder="Code postal *" required>
                <input type="text" id="location_address_town" placeholder="Ville *" required>
            </label>

            <label class="pico">
                Date *
                <input type="date" id="event_date" data-change-type="event-date" required>
            </label>

            <label id="end_date_container" class="pico" hidden>
                <span class="label-help">
                    Date de fin (si plusieurs jours)
                    <button type="button" class="help-btn" data-action="open-end-date-help" aria-label="Aide : fin de l'évènement">
                        <span class="material-symbols-outlined">help</span>
                    </button>
                </span>
                <input type="date" id="end_date" disabled>
            </label>

            <label class="pico">
                Heure de début
                <input type="time" id="event_start_time">
            </label>

            <label class="pico">
                Description de l'évènement
                <textarea id="long_description" class="formtile-longtext" placeholder=""></textarea>
            </label>

            <label class="pico">
                <span class="label-help">
                    Âge du public
                    <button type="button" class="help-btn" data-action="open-age-help" aria-label="Aide : âge du public">
                        <span class="material-symbols-outlined">help</span>
                    </button>
                </span>
                <input id="min_age" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="2" autocomplete="off" placeholder="Âge minimum" step=1 min=0 max=18>
                <input id="max_age" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="2" autocomplete="off" placeholder="Âge maximum" step=1 min=0 max=18>
            </label>

            <label class="pico">
                Téléphone
                <input type="tel" inputmode="tel" id="phone" placeholder="+33 6 12 34 56 78" data-input-type="phone" data-action="phone-input">
            </label>

            <label class="pico">
                Email
                <input type="email" id="email" placeholder="votre@email.com">
            </label>

            <label class="pico">
                Site internet
                <input type="text" id="site_url" placeholder="https://votresite.com">
            </label>

            <label class="pico">
                <fieldset>
                    <label>
                        <input name="to_eat" type="checkbox" role="switch" />
                        À manger sur place
                    </label>
                </fieldset>
            </label>

            <label class="pico">
                Prix / participation
                <select name="select" id="price-choice" data-change-type="price-choice" required></select>
            </label>

            <label class="pico">
                Prix
                <input type="number" id="max_price" placeholder="0.00" step=0.01 min=0 disabled>
            </label>

            <label class="pico">
                Prix réduit
                <input type="number" id="min_price" placeholder="0.00" step=0.01 min=0 disabled>
            </label>

            <label class="pico">
                Image (maximum 10 Mo)
                <div class="event-image-wrapper preview" hidden>
                    <img id="event-thumbnail" class="event-thumbnail loaded" alt="image évènement">
                </div>
                <div class="image-choice">
                    <input type="file" id="event-image" data-change-type="image-choice" accept="image/*" hidden/>
                    <button type="button" id="pick-file-btn" class="secondary" data-action="pick-file">Choisir</button>
                    <span id="file-name" class="file-name">aucun fichier choisi</span>
                    <span id="remove-image-btn" class="material-symbols-outlined delete-image-btn" data-action="remove-image" aria-hidden="true" hidden>delete</span>
                </div>
                
            </label>

            <label id="cancel-btn" class="pico" hidden>
                <button type="submit" class="secondary" data-action="cancel-edit">Annuler</button>
            </label>

            <label class="pico">
                <button type="submit" id="button" data-action="submit-event">Publier</button>
            </label>
        </form>

    </article>
</div>
