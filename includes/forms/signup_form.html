<div id="signup-container" class="page-container" hidden>
    <section class="notice-tile">
        <div class="notice-section-title">
            <span class="material-symbols-outlined" aria-hidden="true">person_add</span>
            <span id="title">S'inscrire</span>
        </div>
        <p id="text" class="notice-text">
            <strong>Créez un compte</strong> pour publier vos événements et contribuer à l'agenda culturel.
        </p>
    </section>
    <article class="formtile-tile pico">
        <form id="signup-form">
            <label>
                Email
                <input
                    type="email"
                    id="email"
                    placeholder="email@exemple.fr"
                    required
                >
            </label>

            <label>
                Nom / pseudo
                <input
                    type="text"
                    id="display_name"
                    placeholder="Votre nom public"
                    required
                >
            </label>

            <label>
                Mot de passe
                <input
                    type="password"
                    id="password"
                    placeholder="Minimum 8 caractères"
                    minlength="8"
                    required
                >
            </label>

            <label>
                Votre status
                <select name="select" id="status" required>
                    <option value="" disabled selected hidden>Choisissez...</option>
                </select>
            </label>

            <div>
                <button type="submit" id="button" data-action="signup">Créer un compte</button>
            </div>
        </form>

        <p>
            Déjà un compte ?
            <a href="#" id="show-signin" data-action="show-signin">Se connecter</a>
        </p>
    </article>
</div>
