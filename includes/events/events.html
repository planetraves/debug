
<div class="events-page">
    <div id="toolbar" class="toolbar">
        <section class="cat-filters">
            <section id="category-options" class="filter-options category"></section>
        </section>

        <section id="more-filters" class="more-filters hidden">
            <hr class="filter-line">
            <div class="filter-area">
                <span class="filter-title">
                    Où ?
                    <span class="material-symbols-outlined" data-action="open-area-help" aria-label="Aide : zone géographique">help</span>
                </span>
                <section id="area-options" class="filter-options area"></section>
            </div>
            <div class="filter-age">
                <span class="filter-title">
                    Age du public ?
                    <span class="material-symbols-outlined" data-action="open-age-help" aria-label="Aide : âge du public">help</span>
                </span>
                <div class="age-inputs">
                    <div class="age-field">
                        <input type="text" name="filter-min-age" class="age-input round" inputmode="numeric" pattern="[0-9]*" maxlength="2" placeholder="Age min." autocomplete="off" data-input-type="filter-age" />
                        <span class="age-suffix">an(s)</span>
                    </div>
                    <span class="age-sep">–</span>
                    <div class="age-field">
                        <input type="text" name="filter-max-age" class="age-input round" inputmode="numeric" pattern="[0-9]*" maxlength="2" placeholder="Age max." autocomplete="off" data-input-type="filter-age" />
                        <span class="age-suffix">an(s)</span>
                    </div>
                </div>
            </div>
            <hr class="filter-line">
            <label class="filter-switch pico">
                <input name="filter-free" type="checkbox" role="switch" data-input-type="filter-switch" />
                <span >Gratuit/prix libre seulement</span>
            </label>
            
            <section id="event-search" class="autocomplete">
                <input
                    type="text"
                    id="data-search"
                    class="data-search round"
                    placeholder="Rechercher par titre, lieu ou tag..."
                    autocomplete="off"
                    data-input-type="event-search"
                />
                <div class="suggestions round hidden"></div>
            </section>
        </section>

        <div class="toolbar-btn">
            <div class="filter-btns">
                <button id="more-filter-btn" class="more-filter-btn" data-action="filter-toggle" aria-expanded="false">
                    <span class="text">Plus de filtres</span>
                    <span class="material-symbols-outlined chevron">keyboard_arrow_down</span>
                </button>
                <button id="reset-filter-btn" class="reset-filter-btn hidden" data-action="reset-filter" aria-expanded="false">
                    <span class="text">Reset</span>
                    <span class="material-symbols-outlined ico">filter_alt_off</span>
                </button>
            </div>
            <div id="switch-view-btns" class="switch-view-btns">
                <span class="material-symbols-outlined help-btn" data-action="open-view-help" aria-label="Aide : affichage et filtres">help</span>
                <span class="material-symbols-outlined" data-action="switch-view" data-view="tiles">view_agenda</span>
                <span class="material-symbols-outlined" data-action="switch-view" data-view="agenda">calendar_month</span>
            </div>
        </div>
    </div>

    <div class="events-main">
        <div id="tiles-view" hidden></div>

        <div id="agenda-view" hidden>
            <div class="calendar-header-bar">
                <span id="today-btn" class="material-symbols-outlined" data-action="nav-today">settings_backup_restore</span>
                <div class="calendar-header-nav">
                    <button id="prev-month" data-action="nav-prev-month"><</button>
                    <span id="calendar-title"></span>
                    <button id="next-month" data-action="nav-next-month">></button>
                </div>
                <span></span>
            </div>
            <div id="calendar" class="calendar"></div>
        </div>

        <div id="empty-state" class="empty-state hidden">
            <span class="material-symbols-outlined">visibility_off</span>
            <span class="text">Aucun évènement à afficher</span>
        </div>
    </div>
</div>
