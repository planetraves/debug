<div id="success-modal" class="modal-overlay success hidden" data-action="close-modal">
    <div class="modal-card success" data-no-action role="dialog" aria-modal="true">
        <button id="modal-close" class="modal-close" data-allow-action data-action="close-modal" aria-label="Fermer">
            <span class="material-symbols-outlined">close</span>
        </button>
        <div id="modal-content" class="modal-content">
            <span class="notice-icon">✔️</span>
            <span id="text"></span>
        </div>
    </div>
</div>

<div id="error-modal" class="modal-overlay error hidden" data-action="close-modal">
    <div class="modal-card error" role="dialog" aria-modal="true">
        <button id="modal-close" class="modal-close" data-allow-action data-action="close-modal" aria-label="Fermer">
            <span class="material-symbols-outlined">close</span>
        </button>
        
        <div id="modal-content" class="modal-content">
            <span class="notice-icon">❌</span>
            <span id="text"></span>
        </div>
        <div id="message" class="error-message"></div>
    </div>
</div>
