<div id="share-modal" class="modal-overlay share hidden" data-action="close-modal">
    <div class="modal-card modal-small" data-no-action role="dialog" aria-modal="true" aria-labelledby="share-modal-title">
        <button class="modal-close" data-allow-action data-action="close-modal" aria-label="Fermer">
            <span class="material-symbols-outlined">close</span>
        </button>

        <div class="modal-content">
            <p id="share-modal-title" class="share-modal-title">
                <span class="material-symbols-outlined" aria-hidden="true">share</span>
                Partager l'évènement
            </p>
        </div>

        <div class="modal-actions">
            <button class="modal-btn basic share-choice" data-allow-action data-action="share-copy-link">
                <span class="material-symbols-outlined" aria-hidden="true">link</span>
                Copier le lien
            </button>
            <button class="modal-btn basic share-choice" data-allow-action data-action="share-native">
                <span class="material-symbols-outlined" aria-hidden="true">ios_share</span>
                Partager
            </button>
        </div>
    </div>
</div>
