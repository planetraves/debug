<div id="event-modal" class="modal-overlay hidden" data-action="close-modal">
    <div id="event-card" class="modal-card long event" data-no-action role="dialog" aria-modal="true">
        <button id="modal-close" class="modal-close" data-allow-action data-action="close-modal" aria-label="Fermer">
            <span class="material-symbols-outlined">close</span>
        </button>
        
        <div id="event-modal-content" class="modal-content"></div>
        
        <div class="modal-actions row">
            <button id="modal-share-btn" class="modal-btn basic" aria-label="partager" data-allow-action data-action="share-event" data-id="">
                <span class="material-symbols-outlined" aria-hidden="true">share</span>
            </button>
            <button id="modal-email-event-btn" class="modal-btn info hidden" aria-label="envoyer un email" data-allow-action data-action="email-event" data-id="">
                <span class="material-symbols-outlined" aria-hidden="true">email</span>
            </button>
            <button id="modal-edit-event-btn" class="modal-btn info hidden" aria-label="editer" data-allow-action data-action="edit-event" data-id="">
                <span class="material-symbols-outlined" aria-hidden="true">edit</span>
            </button>
            <button id="modal-delete-event-btn" class="modal-btn delete hidden" aria-label="supprimer" data-allow-action data-action="open-confirm-modal" data-action-type="delete" data-type="event">
                <span class="material-symbols-outlined" aria-hidden="true">delete</span>
            </button>
            <button id="modal-accept-event-btn" class="modal-btn info hidden" aria-label="accepter" data-allow-action data-action="open-confirm-modal" data-action-type="accept" data-type="event">
                <span class="material-symbols-outlined" aria-hidden="true">thumb_up</span>
            </button>
            <button id="modal-reject-event-btn" class="modal-btn delete hidden" aria-label="rejeter" data-allow-action data-action="open-confirm-modal" data-action-type="reject" data-type="event">
                <span class="material-symbols-outlined" aria-hidden="true">thumb_down</span>
            </button>
        </div>
    </div>
</div>
