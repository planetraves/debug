
site_name: Planet Raves
site_url: https://planetraves.fr
site_description: L'agenda culturel du Rabastinois

theme:
  name: material
  # Production defaults; hooks/supabase_env.py switches these to rose in dev.
  favicon: assets/images/ico-raves-bleu.ico
  logo: assets/images/ico-raves-bleu.png
  custom_dir: docs/assets
  palette:
    - scheme: default
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.top
    - navigation.footer


markdown_extensions:
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.details
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:materialx.emoji.to_svg
  - admonition
  - smarty
  - sane_lists
  - attr_list
  - md_in_html
  - toc:
      permalink: true
      toc_depth: 2-4
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - def_list
  - pymdownx.tasklist:
      custom_checkbox: true

nav:
  - Évènements: index.md
  - Publier un évènement: submit.md
  - Mon compte: account.md
  - L'Équipe: contacts.md
  - Guide: guide.md

# Hidden redirect page (kept out of nav/tabs/menus on purpose)
not_in_nav: |
  /taches.md
  /textes.md

extra_javascript:
  - https://unpkg.com/@supabase/supabase-js@2
  - https://unpkg.com/libphonenumber-js@1.13.3/bundle/libphonenumber-min.js
  - assets/js/global/config.js?v=dev
  - assets/js/global/logger.js?v=dev
  - assets/js/global/helper.js?v=dev
  - assets/js/global/user_profile.js?v=dev
  - assets/js/global/supabase.js?v=dev
  - assets/js/global/notifications.js?v=dev

extra_css:
  - https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,200,1,0
  - https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600;700;800;900&display=swap
  - https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap
  - https://fonts.googleapis.com/css2?family=Audiowide&display=swap
  - https://fonts.googleapis.com/css2?family=Monoton&display=swap
  - https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap
  - https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.conditional.slate.min.css
  - assets/css/theme.css?v=dev
  - assets/css/header.css?v=dev
  - assets/css/nav.css?v=dev
  - assets/css/toolbar.css?v=dev
  - assets/css/tags.css?v=dev
  - assets/css/notice.css?v=dev
  - assets/css/modal.css?v=dev
  - assets/css/events.css?v=dev
  - assets/css/calendar.css?v=dev
  - assets/css/submit.css?v=dev
  - assets/css/account.css?v=dev
  - assets/css/contacts.css?v=dev
  - assets/css/guide.css?v=dev

plugins:
    - macros

hooks:
  - hooks/supabase_env.py
  - hooks/markdown_strings.py
