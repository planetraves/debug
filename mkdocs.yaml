
site_name: Planet Raves
site_subtitle1: "Faites la rave, pas la guerre 💚"
site_subtitle2: "Bienvenue sur l'agenda culturel du Rabastinois 💛"
site_subtitle3: "A Rabastens, Coufouleux, Salvagnac et aux alentours"
site_url: https://planetraves.fr

theme:
  name: material
  favicon: assets/images/logo.ico
  logo: assets/images/logo.png
  custom_dir: docs/assets
  palette:
    - scheme: default
    #   toggle:
    #     name: Dark mode
    #     icon: material/weather-sunny
    # - scheme: slate
    #   toggle:
    #     name: Light mode
    #     icon: material/weather-night
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.top
    - navigation.footer


markdown_extensions:
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.details
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:materialx.emoji.to_svg
  - admonition
  - smarty
  - sane_lists
  - attr_list
  - toc:
      permalink: true
      toc_depth: 2-4
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - def_list
  - pymdownx.tasklist:
      custom_checkbox: true

nav:
  - Évènements: index.md
  - Publier un évènement: submit.md
  - Mon compte: account.md
  - L'Équipe: contacts.md

# Hidden redirect page (kept out of nav/tabs/menus on purpose)
not_in_nav: |
  /taches.md

extra_javascript:
  - https://unpkg.com/@supabase/supabase-js@2
  - https://unpkg.com/libphonenumber-js@1.13.3/bundle/libphonenumber-min.js
  - assets/js/global/config.js?v=dev
  - assets/js/global/helper.js?v=dev
  - assets/js/global/user_profile.js?v=dev
  - assets/js/global/supabase.js?v=dev

extra_css:
  - https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,200,1,0
  - https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600;700;800;900&display=swap
  - https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap
  - https://fonts.googleapis.com/css2?family=Audiowide&display=swap
  - https://fonts.googleapis.com/css2?family=Monoton&display=swap
  - https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.conditional.slate.min.css
  - assets/css/theme.css
  - assets/css/header.css
  - assets/css/nav.css
  - assets/css/toolbar.css
  - assets/css/tags.css
  - assets/css/notice.css
  - assets/css/modal.css
  - assets/css/events.css
  - assets/css/calendar.css
  - assets/css/submit.css
  - assets/css/account.css
  - assets/css/contacts.css

plugins:
    - macros

hooks:
  - hooks/supabase_env.py
